<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ItemHunter AI | Elite Sourcing Concierge</title>
    <!-- Browser Tab Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        :root {
            --bg-color: #08090e;
            --card-bg: rgba(18, 20, 31, 0.95);
            --border-color: rgba(147, 51, 234, 0.2);
            --primary-purple: #7c3aed;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; box-sizing: border-box; }
        
        header { position: sticky; top: 0; z-index: 1000; background: rgba(8, 9, 14, 0.95); backdrop-filter: blur(10px); display: flex; justify-content: space-between; align-items: center; padding: 15px 24px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .header-logo { height: 38px; width: auto; display: block; }
        
        .btn-nav { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
        .btn-nav:hover { background: rgba(255, 255, 255, 0.15); border-color: #7c3aed; }
        
        .hero { text-align: center; padding: 40px 16px 20px; max-width: 900px; margin: 0 auto; }
        .hero h2 { font-size: 36px; font-weight: 800; margin: 0 0 15px 0; line-height: 1.2; }
        .hero h2 span { background: linear-gradient(135deg, #a78bfa, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { font-size: 14px; color: var(--text-muted); padding: 0 10px; }
        
        .form-container { max-width: 800px; margin: 15px auto 60px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 24px; box-sizing: border-box; width: 92%; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        .form-group { margin-bottom: 16px; }
        .form-group.full { grid-column: span 2; }
        label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
        input, select { width: 100%; padding: 12px 14px; background: rgba(8, 9, 14, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: #fff; font-size: 14px; box-sizing: border-box; }
        
        .package-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
        .package-card { background: rgba(8, 9, 14, 0.4); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 18px; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; justify-content: space-between; }
        .package-card.selected { border-color: #7c3aed; background: rgba(124, 58, 237, 0.15); box-shadow: 0 0 15px rgba(124, 58, 237, 0.2); }
        .package-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
        .package-card h4 { margin: 0; font-size: 15px; color: #fff; }
        .package-card .price { font-size: 18px; font-weight: 700; color: #a78bfa; margin-bottom: 6px; }
        .package-card p { font-size: 11px; margin: 0; color: var(--text-muted); line-height: 1.4; }

        .btn-submit { width: 100%; background: linear-gradient(135deg, #7c3aed, #4f46e5); color: white; border: none; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 5px; box-shadow: 0 10px 20px -5px rgba(124, 58, 237, 0.4); }
        .btn-submit:hover { opacity: 0.9; }
        
        .staff-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 99999; justify-content: center; align-items: center; padding: 16px; box-sizing: border-box; }
        .staff-box { background: #12141f; border: 1px solid #7c3aed; padding: 28px 20px; border-radius: 16px; width: 100%; max-width: 380px; box-sizing: border-box; text-align: left; }
        
        .stats-grid-staff { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 24px; }
        .stat-box { background: rgba(8,9,14,0.6); border: 1px solid rgba(255,255,255,0.05); padding: 12px; border-radius: 10px; text-align: center; }
        .stat-box h4 { margin: 0 0 4px 0; font-size: 18px; color: #a78bfa; }
        .stat-box span { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }
        
        .order-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        .order-table th, .order-table td { padding: 12px 8px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); vertical-align: middle; }
        .order-table th { color: #a78bfa; text-transform: uppercase; font-size: 10px; letter-spacing: 0.05em; }
        .btn-action { background: #7c3aed; color: #fff; border: none; padding: 6px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; font-weight: 600; margin-right: 4px; margin-bottom: 4px; display: inline-block; }
        .btn-action:hover { background: #6d28d9; }
        .btn-delete { background: #ef4444; }
        .btn-delete:hover { background: #dc2626; }

        @media (max-width: 768px) {
            header { padding: 12px 16px; }
            .hero h2 { font-size: 28px; }
            .form-row { grid-template-columns: 1fr; gap: 0; }
            .form-group.full { grid-column: span 1; }
            .package-grid { grid-template-columns: 1fr; gap: 12px; }
            .form-container { padding: 16px; width: 95%; margin: 10px auto 40px; }
            .stats-grid-staff { grid-template-columns: repeat(2, 1fr); }
            
            .order-table thead { display: none; }
            .order-table, .order-table tbody, .order-table tr, .order-table td { display: block; width: 100%; box-sizing: border-box; }
            .order-table tr { background: rgba(8, 9, 14, 0.5); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; margin-bottom: 16px; padding: 14px; }
            .order-table td { padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); text-align: left; }
            .order-table td:last-child { border-bottom: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <img src="/logo.png" alt="ItemHunter AI" class="header-logo" onerror="this.style.display='none'; document.getElementById('fallbackLogoText').style.display='block';">
            <h1 id="fallbackLogoText" style="display: none; margin: 0; font-size: 18px; color: #fff; font-weight: 800;">ItemHunter AI</h1>
        </div>
        <div>
            <button class="btn-nav" id="staffPortalBtn" onclick="openPinModal()">Staff Portal</button>
        </div>
    </header>

    <!-- Main Public Landing Page -->
    <div id="publicMainContent">
        <div class="hero">
            <h2>We Hunt Down<br><span>Impossible-to-Find</span> Items.</h2>
            <p>Our advanced AI scrapes Amazon, Facebook Marketplace, KSL Classifieds, eBay, and local networks instantly.</p>
        </div>

        <div class="form-container" id="requestFormSection">
            <h3 style="margin-top: 0; font-size: 18px;">Item Request Intake Form</h3>
            <p style="color: var(--text-muted); font-size: 12px; margin-bottom: 24px;">Fill out your specifications below to deploy our AI search engine.</p>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Your Full Name</label>
                    <input type="text" id="customerName" placeholder="e.g., Sarah Jenkins">
                </div>
                <div class="form-group">
                    <label>Email or Phone Number</label>
                    <input type="text" id="customerContact" placeholder="e.g., (801) 555-0192">
                </div>
            </div>

            <div class="form-group full">
                <label>What is the item?</label>
                <input type="text" id="itemQuery" placeholder="e.g., 2013 Honda Accord Front Bumper">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Specifics, Colors, Year & Details</label>
                    <input type="text" id="itemSpecifics" placeholder="e.g.,
