<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ItemHunter AI</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 8px; }
        input, button { width: 100%; padding: 10px; margin-top: 10px; border-radius: 4px; border: none; }
        button { background: #007bff; color: white; font-weight: bold; cursor: pointer; }
        .results { margin-top: 20px; background: #2a2a2a; padding: 15px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>ItemHunter AI Portal</h2>
        
        <!-- Clean Staff Login Form (No 'ex' prefix) -->
        <div id="loginSection">
            <h3>Staff Login</h3>
            <input type="text" id="staffUsername" placeholder="Enter Username" required>
            <input type="password" id="staffPin" placeholder="Enter PIN (e.g., 0710)" required>
            <button onclick="loginStaff()">Login</button>
        </div>

        <!-- Item Search Form (Triggers automatically on submit) -->
        <div id="searchSection" style="display:none;">
            <h3>Live Item Search</h3>
            <input type="text" id="itemQuery" placeholder="What item are you hunting for?">
            <input type="number" id="targetPrice" placeholder="Target Max Price ($)">
            <input type="text" id="customerPhone" placeholder="Customer Phone Number">
            <input type="email" id="customerEmail" placeholder="Customer Email">
            <button onclick="startAutoSearch()">Search Item Now</button>

            <div id="searchResults" class="results" style="display:none;">
                <h4>Live AI Results & Links:</h4>
                <div id="outputContent"></div>
            </div>
        </div>
    </div>

    <script>
        function loginStaff() {
            const user = document.getElementById('staffUsername').value;
            const pin = document.getElementById('staffPin').value;
            if(pin === "0710" && user.trim() !== "") {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('searchSection').style.display = 'block';
            } else {
                alert("Invalid Username or PIN.");
            }
        }

        // Automatically executes the search payload when clicked
        async function startAutoSearch() {
            const itemQuery = document.getElementById('itemQuery').value;
            const targetPrice = document.getElementById('targetPrice').value;
            const customerPhone = document.getElementById('customerPhone').value;
            const customerEmail = document.getElementById('customerEmail').value;

            if(!itemQuery) {
                alert("Please enter an item to search.");
                return;
            }

            document.getElementById('outputContent').innerHTML = "AI is scanning live web listings...";
            document.getElementById('searchResults').style.display = 'block';

            try {
                const response = await fetch('/api/hunt-item', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ itemQuery, targetPrice, customerPhone, customerEmail })
                });
                const data = await response.json();

                if(data.success) {
                    document.getElementById('outputContent').innerHTML = `
                        <p><strong>Findings:</strong> ${data.results.replace(/\n/g, '<br>')}</p>
                        <p><a href="${data.defaultLink}" target="_blank" style="color: #4da6ff;">Direct Web Search Link</a></p>
                        <p style="color: #ffc107;">${data.staffNotice}</p>
                    `;
                } else {
                    document.getElementById('outputContent').innerHTML = "Search failed.";
                }
            } catch (err) {
                document.getElementById('outputContent').innerHTML = "Error connecting to server.";
            }
        }
    </script>
</body>
</html>
