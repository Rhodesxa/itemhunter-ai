<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ItemHunter AI | Live Procurement</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(30, 41, 59, 0.75);
            --border-color: rgba(56, 189, 248, 0.2);
            --primary-blue: #0284c7;
            --primary-hover: #0369a1;
            --accent-glow: rgba(56, 189, 248, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        h2 {
            margin-top: 0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: #38bdf8;
        }

        p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 6px;
            margin-top: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #334155;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        select option {
            background: #0f172a;
            color: #fff;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: white;
            font-weight: 600;
            font-size: 15px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        button:hover {
            background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.4);
        }

        button.secondary {
            background: rgba(51, 65, 85, 0.6);
            box-shadow: none;
            margin-top: 10px;
        }

        button.secondary:hover {
            background: rgba(71, 85, 105, 0.8);
        }

        .results {
            margin-top: 25px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #334155;
            padding: 20px;
            border-radius: 10px;
        }

        .results h4 {
            margin-top: 0;
            color: #38bdf8;
            font-size: 16px;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }

        .top-nav {
            position: absolute;
            top: 24px;
            right: 24px;
            width: auto;
            padding: 6px 14px;
            font-size: 12px;
            margin-top: 0;
            background: rgba(51, 65, 85, 0.4);
            border: 1px solid #475569;
            box-shadow: none;
        }

        .top-nav:hover {
            background: rgba(51, 65, 85, 0.8);
        }

        .badge-success {
            color: #4ade80;
            font-weight: 600;
        }

        .notice-text {
            color: #facc15;
            font-size: 13px;
            margin-top: 12px;
            padding-top: 8px;
            border-top: 1px dashed #334155;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Top Navigation Button to Switch Views -->
        <button id="navBtn" class="top-nav" onclick="toggleStaffPortal()">Staff Portal</button>

        <!-- CUSTOMER VIEW -->
        <div id="customerSection">
            <h2>ItemHunter AI Search</h2>
            <p>Specify your item parameters, condition preferences, and price tier below.</p>
            
            <label for="itemQuery">What item are you hunting for?</label>
            <input type="text" id="itemQuery" placeholder="e.g., Sony WH-1000XM5 Headphones">
            
            <label for="itemCondition">Preferred Condition</label>
            <select id="itemCondition">
                <option value="Any">Any Condition</option>
                <option value="Brand New">Brand New / Sealed</option>
                <option value="Like New">Like New / Open Box</option>
                <option value="Refurbished">Certified Refurbished</option>
                <option value="Used">Used / Good
